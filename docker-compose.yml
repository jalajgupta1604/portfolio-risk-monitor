services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riskadmin
      POSTGRES_PASSWORD: riskpass123
      POSTGRES_DB: portfolio_risk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskadmin -d portfolio_risk"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://riskadmin:riskpass123@db:5432/portfolio_risk
      DATABASE_URL_SYNC: postgresql+psycopg2://riskadmin:riskpass123@db:5432/portfolio_risk
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
