services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riskadmin
      POSTGRES_PASSWORD: riskpass123
      POSTGRES_DB: portfolio_risk
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskadmin -d portfolio_risk"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://riskadmin:riskpass123@db:5432/portfolio_risk
      DATABASE_URL_SYNC: postgresql+psycopg2://riskadmin:riskpass123@db:5432/portfolio_risk
      JWT_SECRET: change-me-in-production
      OAUTH_BRIDGE_SECRET: ${OAUTH_BRIDGE_SECRET:-change-me-bridge-secret}
      API_BASE_URL: http://app:8000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      API_URL_INTERNAL: http://app:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      AUTH_SECRET: changeme-generate-a-real-secret-for-production
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_BRIDGE_SECRET: ${OAUTH_BRIDGE_SECRET:-change-me-bridge-secret}
    depends_on:
      - app

volumes:
  pgdata:
